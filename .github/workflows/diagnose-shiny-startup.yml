name: Diagnose public Shiny startup (redacted)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-shiny-startup.yml

permissions:
  contents: read

jobs:
  startup-logs:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
      SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: false
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
      - name: Retrieve and sanitize only technical startup failures
        run: Rscript scripts/diagnose_public_shiny.R
