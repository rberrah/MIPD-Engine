name: Standalone MIPD qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tdm-preview:
    name: Draft STP preview (non-runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate drug crosswalk and 46 model recommendations offline
        run: node tests/tdm_guide_adapter_preview.test.mjs
      - name: Validate MIPD dose grids and preset eligibility offline
        run: node tests/tdm_guide_presets.test.mjs

  tdm-preview-integrated:
    name: Draft STP integration against pinned PMx catalogue (no runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Immutable PMx commit, deliberately pinned so this draft is reproducible and
      # a PMx edit can never silently change MIPD's view of the guide.
      # MAINTENANCE: every new commit on the PMx branch feat/tdm-mipd-reference-export-preview-*
      # requires bumping this SHA by hand, otherwise this job keeps validating an older
      # guide than the one PMx actually serves. Bump it in the same PR that reviews the
      # PMx change, and re-read the mismatch counts asserted below.
      - uses: actions/checkout@v7
        with:
          repository: rberrah/rberrah.github.io
          ref: 213cbe8985913072cdf872457fceeaba43e1188e
          path: .pmx-tdm-source-preview
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate exact drug-ID crosswalk parity across independent repos
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {mipdDrugToTdmId} from './.pmx-tdm-source-preview/src/lib/tdm/mipdDrugCrosswalk.preview.v1.js';
          const canonical=JSON.parse(await readFile('integration/tdm-guide-drug-crosswalk.preview.v1.json','utf8'));
          assert.deepEqual(mipdDrugToTdmId,canonical.keys,'PMx guide and MIPD canonical drug keys drifted');
          assert.equal(Object.keys(mipdDrugToTdmId).length,23);
          console.log('Cross-repo parity: 23 / 23 drug IDs match pinned MIPD source');
          EOF
      - name: Export the real PMx bibliographic guide as a local immutable snapshot
        run: node .pmx-tdm-source-preview/scripts/export_tdm_model_references.mjs --output /tmp/pmx-tdm-guide-preview.json
      - name: Build all MIPD model recommendations from the versioned real snapshot
        run: node scripts/preview_tdm_guide_recommendations.mjs --snapshot /tmp/pmx-tdm-guide-preview.json --output /tmp/mipd-tdm-recommendations-preview.json
      # The app now reads committed artifacts, so they must match the pinned guide exactly.
      - name: Reject drift in the committed STP recommendation artifact
        run: |
          node scripts/preview_tdm_guide_recommendations.mjs --snapshot /tmp/pmx-tdm-guide-preview.json --output /tmp/rebuilt-recommendations.json
          node --input-type=module -e "
            import fs from 'node:fs'; import assert from 'node:assert/strict';
            const a=JSON.parse(fs.readFileSync('integration/tdm-guide-recommendations.v1.json','utf8'));
            const b=JSON.parse(fs.readFileSync('/tmp/rebuilt-recommendations.json','utf8'));
            assert.equal(a.sha256,b.sha256,'Committed STP artifact is stale: regenerate it from the pinned PMx commit');
            console.log('Committed STP artifact matches the pinned guide.');
          "
      - name: Reject drift in the committed clinical preset artifact
        run: node scripts/build_tdm_guide_presets.mjs --snapshot /tmp/pmx-tdm-guide-preview.json --output integration/tdm-guide-clinical-presets.v1.json --check
      - name: Verify preset artifact against the real guide and the curated presets
        run: node tests/tdm_guide_presets.test.mjs /tmp/pmx-tdm-guide-preview.json
      - name: Require 46 explicit, non-clinical recommendations without patient data
        run: |
          node --input-type=module -e "
            import fs from 'node:fs'; import assert from 'node:assert/strict';
            const s=JSON.parse(fs.readFileSync('/tmp/pmx-tdm-guide-preview.json','utf8'));
            const p=JSON.parse(fs.readFileSync('/tmp/mipd-tdm-recommendations-preview.json','utf8'));
            assert.equal(s.drugs.length,154);
            assert.equal(s.drugs.flatMap(d=>d.targets).length,141);
            assert.equal(p.models.length,46);
            assert.equal(p.models.filter(m=>m.recommendation.status==='not_indexed_in_guide').length,5);
            assert.ok(p.models.every(m=>m.recommendation.interpretationAllowed===false));
            assert.ok(p.models.every(m=>m.recommendation.automaticDoseAdjustmentAllowed===false));
            assert.equal(p.sourceSnapshotSha256,s.sha256);
            const refs=p.models.flatMap(m=>m.recommendation.numericalReferenceCandidates);
            // No gate may ever conclude that a published value applies to a model.
            assert.ok(refs.every(c=>c.modelApplicabilityVerified===false&&
              ['requires_human_context_review','structural_context_mismatch'].includes(c.applicability.verdict)));
            // Real-data tripwire: a reference whose declared context contradicts the
            // model must stay flagged. The FDA liver-transplant tacrolimus target is
            // listed on kidney-transplant models and must never be shown unflagged.
            const flagged=p.models.flatMap(m=>m.recommendation.numericalReferenceCandidates
              .filter(c=>c.applicability.mismatches.length).map(c=>m.modelId+'/'+c.id));
            assert.ok(flagged.includes('tacrolimus_woillard_ddi/tac-liver-everolimus-fda'),
              'Liver-transplant tacrolimus reference must be flagged on a kidney model');
            assert.ok(flagged.includes('tacrolimus_kamp_envarsus_ddi/tac-liver-everolimus-fda'));
            assert.equal(flagged.length,8,'Structural context mismatches changed: re-review the gates');
            assert.equal(p.models.filter(m=>m.recommendation.administrationModeWarningCount>0).length,10);
            // Formulation stays undecidable until the guide publishes it, and must be said so.
            assert.ok(p.models.find(m=>m.modelId==='tacrolimus_kamp_envarsus_ddi')
              .recommendation.numericalReferenceCandidates
              .every(c=>c.applicability.undecidable.includes('formulationId')));
            console.log('Real snapshot linked to 46 model preview cards. '+flagged.length+
              ' context mismatches flagged. No runtime activation.');
          "

  origin-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Checkout immutable PMx extraction origin (fallback for pruned source blobs)
        uses: actions/checkout@v7
        with:
          repository: rberrah/rberrah.github.io
          ref: 2f97f109c3f4af257776a595f6546c9cd5f2321d
          path: .origin-source
          persist-credentials: false
      - name: Verify frozen PMx origin hashes and pinned origin fallback
        run: python scripts/verify_origin_manifest.py
      - name: Check public-release probe rejects stale and unsafe versions
        run: python3 tests/check_live_deployment_test.py
      - name: Syntax-check public session browser probe
        run: python3 -m py_compile scripts/check_live_deployment.py scripts/check_live_sessions.py
      - name: Check model and ML DOI provenance consistency
        run: python scripts/check_doi_consistency.py
      - name: Audit all 46 synthetic ML artifact evidence records
        run: python3 scripts/audit_ml_evidence.py
      - name: Upload machine-readable ML evidence matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipd-ml-evidence
          path: scientific-validation/ml-evidence.generated.json
          if-no-files-found: ignore
      - name: Regenerate standalone model catalogue
        run: node scripts/generate_model_catalog.mjs
      - name: Regenerate model traceability
        run: node scripts/generate_tdm_traceability.mjs
      - name: Verify generated model-library outputs are committed
        run: git diff --exit-code -- models ml/catalog-summary.generated.json docs/tdm-model-traceability.md docs/tdm-model-traceability.json

  core-r:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: false
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
      - name: Verify exact core runtime contract
        run: Rscript scripts/check_runtime.R core
      - name: Verify immutable runtime public safety policy
        run: Rscript tests/deployment_profile_test.R
      - name: Validate release fingerprint and full production app bundle offline
        shell: bash
        run: |
          Rscript scripts/deploy_shiny.R --verify-bundle
          test ! -e www/deployment-release.json
      - name: Validate standalone public deployment manifest
        env:
          ALLOW_CUSTOM_MODELS: "false"
          ENABLE_PMETRICS: "false"
        run: Rscript scripts/deploy_shiny.R
      - name: Compile and validate all 46 models
        run: Rscript tests/validate_library.R
      - name: Run deterministic model references
        run: Rscript tests/model_reference_cases.R
      - name: Check synthetic dosing and numerical solver invariants for all 46 models
        run: Rscript tests/all_model_numeric_invariants.R
      - name: Check 13 experimental MAP priors have valid covariance and synthetic profiles
        run: Rscript tests/map_prior_numeric_matrix.R
      - name: Upload independent all-model numerical evidence candidate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipd-all-model-numeric-matrix
          path: |
            scientific-validation/all-model-invariants.generated.json
            scientific-validation/map-prior-matrix.generated.json
          if-no-files-found: ignore
      - name: Audit model-level scientific evidence register
        run: python3 scripts/audit_scientific_evidence.py
      - name: Run independent primary-source equation oracles
        run: Rscript tests/source_equation_reproduction.R
      - name: Test Goti 2018 analytical two-compartment oracle and renal boundaries
        run: Rscript tests/goti_source_equations.R
      - name: Compare Roberts, Revilla and Goti MAP priors against independent optimization
        run: Rscript tests/independent_map_prior_oracles.R
      - name: Verify Carlier amoxicillin analytical two-compartment and exposure invariants
        run: Rscript tests/amox_carlier_analytical_invariants.R
      - name: Upload 46-model scientific evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mipd-scientific-coverage
          path: scientific-validation/coverage.generated.json
          if-no-files-found: ignore
      - name: Test safe Lego contract
        run: Rscript tests/safe_lego_test.R
      - name: Test private workspace cleanup
        run: Rscript tests/privacy_nonretention_test.R
      - name: Run remaining standalone R regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.R; do
            case "$(basename "$test")" in
              validate_library.R|model_reference_cases.R|all_model_numeric_invariants.R|map_prior_numeric_matrix.R|source_equation_reproduction.R|goti_source_equations.R|independent_map_prior_oracles.R|amox_carlier_analytical_invariants.R|deployment_profile_test.R|safe_lego_test.R|privacy_nonretention_test.R|pmetrics_backend_test.R|advanced_lego_test.R|lego_external_exports.R|lego_mlxtran_exports.R|lego_native_exports.R|covariates_native_test.R|input_labs_test.R|teaching_lab_test.R|workshop_pk_test.R)
                continue
                ;;
            esac
            echo "=== $test ==="
            Rscript "$test"
          done

  pmetrics:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PMETRICS_VERSION: "3.2.6"
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Install pinned Pmetrics runtime
        run: |
          for attempt in 1 2 3; do
            Rscript -e 'rv <- paste(R.version$major, strsplit(R.version$minor, "\\.")[[1]][1], sep = "."); binary_repo <- function(universe) sprintf("https://%s.r-universe.dev/bin/linux/resolute-%s/%s", universe, R.version$arch, rv); options(repos = c(LAPKB = binary_repo("lapkb"), CRAN = binary_repo("cran"))); install.packages(c("Pmetrics","mrgsolve","mapbayr","jsonlite")); stopifnot(as.character(packageVersion("Pmetrics")) == Sys.getenv("PMETRICS_VERSION"))' && break
            test "$attempt" -eq 3 && exit 1
            sleep 15
          done
      - name: Verify exact Pmetrics runtime contract
        run: Rscript scripts/check_runtime.R pmetrics
      - name: Test Pmetrics patient-level backend
        run: Rscript tests/pmetrics_backend_test.R
